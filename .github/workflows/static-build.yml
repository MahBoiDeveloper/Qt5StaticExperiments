name: build-static-qt5

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  build-linux:
    name: build (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repo with submodules
        uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Show repository tree
        run: |
          pwd
          ls -la
          find . -maxdepth 3 -type d | sort

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential perl python3 git pkg-config cmake ninja-build \
            libgl1-mesa-dev libx11-dev libx11-xcb-dev libxcb1-dev \
            libxext-dev libxrender-dev libxi-dev libfontconfig1-dev \
            libfreetype6-dev libssl-dev zlib1g-dev \
            libsqlite3-dev libdbus-1-dev \
            libxcb-xinerama0-dev libxcb-randr0-dev libxcb-image0-dev \
            libxcb-keysyms1-dev libxcb-icccm4-dev libxcb-shape0-dev \
            libxcb-sync-dev libxcb-xfixes0-dev

      - name: Verify Qt5 submodule exists
        run: |
          test -d libs/Qt5 || (echo "Qt5 submodule not found!" && exit 1)
          test -f libs/Qt5/configure || (echo "configure script not found!" && exit 1)
          echo "Qt5 submodule verified"

      - name: Configure Qt5 static build
        working-directory: ./libs/Qt5
        run: |
          ./configure \
            -static \
            -release \
            -opensource \
            -confirm-license \
            -nomake examples \
            -nomake tests \
            -prefix ${{ github.workspace }}/qt-static \
            -qt-zlib \
            -qt-libpng \
            -qt-libjpeg \
            -qt-pcre \
            -qt-freetype \
            -qt-harfbuzz 2>&1 | tee configure.log
          test ${PIPESTATUS[0]} -eq 0 || exit 1

      - name: Build Qt5
        run: |
          echo "Building with $(nproc) parallel jobs..."
          cmake --build libs/Qt5 --parallel $(nproc) 2>&1 | tee build.log
          test ${PIPESTATUS[0]} -eq 0 || (tail -100 build.log && exit 1)

      - name: Install Qt5
        working-directory: ./libs/Qt5
        run: |
          cmake --install libs/Qt5
          echo "Qt5 installation complete"

      - name: Verify Qt5 installation
        run: |
          test -f ${{ github.workspace }}/qt-static/bin/qmake || (echo "qmake not found!" && exit 1)
          test -d ${{ github.workspace }}/qt-static/lib || (echo "lib directory not found!" && exit 1)
          ${{ github.workspace }}/qt-static/bin/qmake -version
          echo "Qt5 static build verified successfully"
          ls -lh ${{ github.workspace }}/qt-static/lib/ | head -20

      - name: Upload Qt5 static build
        uses: actions/upload-artifact@v5
        with:
          name: qt5-static-linux-${{ github.run_id }}
          path: qt-static/
          retention-days: 30
          if-no-files-found: error

      - name: Create build summary
        if: success()
        run: |
          echo "## Qt5 Static Build Successful (Linux)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Build Date**: $(date)" >> $GITHUB_STEP_SUMMARY
          echo "- **Qt5 Version**: $(${{
            github.workspace
          }}/qt-static/bin/qmake -version | head -1)" >> $GITHUB_STEP_SUMMARY
          echo "- **Install Path**: qt-static/" >> $GITHUB_STEP_SUMMARY
          echo "- **Artifact**: qt5-static-linux-${{ github.run_id }}" >> $GITHUB_STEP_SUMMARY

  build-windows:
    name: build (Windows)
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repo with submodules
        uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Verify Qt5 submodule exists
        shell: pwsh
        run: |
          if (!(Test-Path ./libs/Qt5)) { throw "Qt5 submodule not found!" }
          if (!(Test-Path ./libs/Qt5/configure)) { throw "configure script not found!" }
          "Qt5 submodule verified"

      # Поднимаем окружение MSVC (для cl.exe/link.exe и т.п.)
      - name: Setup MSVC Developer Command
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # В windows-latest обычно уже есть cmake/ninja/MSVC. Но оставим установку по желанию:
      - name: Install build tools (if needed)
        shell: pwsh
        run: |
          choco install -y ninja cmake strawberryperl
          # Perl часто нужен для скриптов Qt/configure. На некоторых образах он уже есть.

      - name: Configure Qt5 static build
        shell: cmd
        run: |
          set "PREFIX=%CD%\qt-static"
          cd libs\Qt5
          configure ^
            -static ^
            -release ^
            -opensource ^
            -confirm-license ^
            -nomake examples ^
            -nomake tests ^
            -prefix "%PREFIX%" ^
            -qt-zlib ^
            -qt-libpng ^
            -qt-libjpeg ^
            -qt-pcre ^
            -qt-freetype ^
            -qt-harfbuzz > configure.log 2>&1
          if errorlevel 1 exit /b 1

      - name: Build Qt5
        shell: cmd
        run: |
          cmake --build libs/Qt5 --parallel %NUMBER_OF_PROCESSORS% > build.log 2>&1
          if errorlevel 1 (
            type build.log
            exit /b 1
          )

      - name: Install Qt5
        shell: cmd
        run: |
          cmake --install libs/Qt5 > install.log 2>&1
          if errorlevel 1 (
            type install.log
            exit /b 1
          )
          echo Qt5 installation complete

      - name: Verify Qt5 installation
        shell: pwsh
        run: |
          $qmake = Join-Path $PWD "qt-static\bin\qmake.exe"
          if (!(Test-Path $qmake)) { throw "qmake not found: $qmake" }
          if (!(Test-Path (Join-Path $PWD "qt-static\lib"))) { throw "lib directory not found" }
          & $qmake -version | Out-Host
          "Qt5 static build verified successfully"
          Get-ChildItem -Path (Join-Path $PWD "qt-static\lib") -File | Select-Object -First 20 | ForEach-Object { $_.FullName }

      - name: Upload Qt5 static build
        uses: actions/upload-artifact@v5
        with:
          name: qt5-static-windows-${{ github.run_id }}
          path: qt-static/
          retention-days: 30
          if-no-files-found: error

      - name: Create build summary
        if: success()
        shell: pwsh
        run: |
          $qmake = Join-Path $PWD "qt-static\bin\qmake.exe"
          $ver = (& $qmake -version | Select-Object -First 1).ToString()
          Add-Content $env:GITHUB_STEP_SUMMARY "## Qt5 Static Build Successful (Windows)"
          Add-Content $env:GITHUB_STEP_SUMMARY ""
          Add-Content $env:GITHUB_STEP_SUMMARY "- **Build Date**: $(Get-Date)"
          Add-Content $env:GITHUB_STEP_SUMMARY "- **Qt5 Version**: $ver"
          Add-Content $env:GITHUB_STEP_SUMMARY "- **Install Path**: qt-static/"
          Add-Content $env:GITHUB_STEP_SUMMARY "- **Artifact**: qt5-static-windows-${{ github.run_id }}"
