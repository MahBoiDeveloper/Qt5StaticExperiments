name: build-static-qt5

on:
  push:
    branches: [ "main" ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Show repository tree
        run: |
          pwd
          ls -la
          find . -maxdepth 3 -type d | sort

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential perl python3 git pkg-config \
            libgl1-mesa-dev libx11-dev libx11-xcb-dev libxcb1-dev \
            libxext-dev libxrender-dev libxi-dev libfontconfig1-dev \
            libfreetype6-dev libssl-dev zlib1g-dev \
            libsqlite3-dev libdbus-1-dev \
            libxcb-xinerama0-dev libxcb-randr0-dev libxcb-image0-dev \
            libxcb-keysyms1-dev libxcb-icccm4-dev libxcb-shape0-dev \
            libxcb-sync-dev libxcb-xfixes0-dev

      - name: Configure Qt5 static build
        working-directory: ./libs/Qt5
        run: |
          ./configure \
            -static \
            -release \
            -opensource \
            -confirm-license \
            -nomake examples \
            -nomake tests \
            -prefix ${{ github.workspace }}/qt-static \
            -qt-zlib \
            -qt-libpng \
            -qt-libjpeg \
            -qt-pcre \
            -qt-freetype \
            -qt-harfbuzz

      - name: Build Qt5
        working-directory: ./libs/Qt5
        run: |
          make -j$(nproc)

      - name: Install Qt5
        working-directory: ./libs/Qt5
        run: |
          make install
