name: pack-source

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: package source (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux
          - os: windows-2022
            platform: windows

    steps:
      - name: Enable Git long paths
        if: runner.os == 'Windows'
        shell: pwsh
        run: git config --global core.longpaths true

      - name: Checkout repository with all submodules
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Install 7-Zip
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y p7zip-full

      - name: Create and verify Linux archives
        if: runner.os == 'Linux'
        shell: bash
        env:
          TAR_ARCHIVE: ${{ runner.temp }}/source-${{ github.sha }}-linux.tar.gz
          SEVEN_ARCHIVE: ${{ runner.temp }}/source-${{ github.sha }}-linux.7z
        run: |
          tar_args=(
            --exclude=.git
            '--exclude=*/.git'
            -czf "$TAR_ARCHIVE"
            .
          )
          tar "${tar_args[@]}"

          tar_listing="$RUNNER_TEMP/tar-listing.txt"
          tar -tzf "$TAR_ARCHIVE" > "$tar_listing"
          sed -n '1,100p' "$tar_listing"

          if grep -E '(^|/)\.git(/|$)' "$tar_listing"; then
            echo "The tar archive contains Git metadata"
            exit 1
          fi

          seven_args=(
            a
            -t7z
            -mx=5
            "$SEVEN_ARCHIVE"
            .
            '-xr!.git'
          )
          7z "${seven_args[@]}"

          seven_listing="$RUNNER_TEMP/7z-listing.txt"
          7z l -slt "$SEVEN_ARCHIVE" > "$seven_listing"
          sed -n '1,100p' "$seven_listing"

          if grep -E '^Path = (.*[/\\])?\.git([/\\].*)?$' "$seven_listing"; then
            echo "The 7z archive contains Git metadata"
            exit 1
          fi

          test -s "$TAR_ARCHIVE"
          test -s "$SEVEN_ARCHIVE"
          ls -lh "$TAR_ARCHIVE" "$SEVEN_ARCHIVE"

      - name: Create and verify Windows archives
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TAR_ARCHIVE: ${{ runner.temp }}/source-${{ github.sha }}-windows.tar.gz
          SEVEN_ARCHIVE: ${{ runner.temp }}/source-${{ github.sha }}-windows.7z
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $false

          $tarArguments = @(
            "--exclude=.git",
            "--exclude=*/.git",
            "-czf",
            $env:TAR_ARCHIVE,
            "."
          )
          & tar @tarArguments
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to create the tar archive"
          }

          $tarListing = Join-Path $env:RUNNER_TEMP "tar-listing.txt"
          & tar -tzf "$env:TAR_ARCHIVE" |
            Set-Content -Encoding utf8NoBOM $tarListing
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to inspect the tar archive"
          }

          Get-Content $tarListing -TotalCount 100 | Out-Host
          if (Select-String -Path $tarListing -Pattern '(^|/)\.git(/|$)' -Quiet) {
            throw "The tar archive contains Git metadata"
          }

          $sevenZip = Get-Command 7z.exe -ErrorAction SilentlyContinue
          if (-not $sevenZip) {
            $sevenZip = Get-Command 7zz.exe -ErrorAction SilentlyContinue
          }
          if (-not $sevenZip) {
            throw "7-Zip was not found"
          }

          $sevenArguments = @(
            "a",
            "-t7z",
            "-mx=5",
            $env:SEVEN_ARCHIVE,
            ".",
            "-xr!.git"
          )
          & $sevenZip.Source @sevenArguments
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to create the 7z archive"
          }

          $sevenListing = Join-Path $env:RUNNER_TEMP "7z-listing.txt"
          & $sevenZip.Source l -slt "$env:SEVEN_ARCHIVE" |
            Set-Content -Encoding utf8NoBOM $sevenListing
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to inspect the 7z archive"
          }

          Get-Content $sevenListing -TotalCount 100 | Out-Host
          $gitPattern = '^Path = (.*[\\/])?\.git([\\/].*)?$'
          if (Select-String -Path $sevenListing -Pattern $gitPattern -Quiet) {
            throw "The 7z archive contains Git metadata"
          }

          foreach ($archive in @($env:TAR_ARCHIVE, $env:SEVEN_ARCHIVE)) {
            $item = Get-Item $archive
            if ($item.Length -eq 0) {
              throw "Archive is empty: $archive"
            }
            $item | Format-Table Name, Length
          }

      - name: Upload tar.gz archive
        uses: actions/upload-artifact@v5
        with:
          name: source-${{ github.sha }}-${{ matrix.platform }}-tar-gz
          path: ${{ runner.temp }}/source-${{ github.sha }}-${{ matrix.platform }}.tar.gz
          compression-level: 0
          retention-days: 30
          if-no-files-found: error

      - name: Upload 7z archive
        uses: actions/upload-artifact@v5
        with:
          name: source-${{ github.sha }}-${{ matrix.platform }}-7z
          path: ${{ runner.temp }}/source-${{ github.sha }}-${{ matrix.platform }}.7z
          compression-level: 0
          retention-days: 30
          if-no-files-found: error

      - name: Create package summary
        if: success()
        shell: bash
        run: |
          {
            echo "## Source package"
            echo ""
            echo "- Platform: ${{ matrix.platform }}"
            echo "- Commit: $GITHUB_SHA"
            echo "- Formats: tar.gz, 7z"
            echo "- Git metadata: excluded"
            echo "- Submodules: included recursively"
          } >> "$GITHUB_STEP_SUMMARY"
